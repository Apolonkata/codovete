<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн Магазин</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Store<span>Logo</span></div>
    <nav>
      <a href="#">Начало</a>
      <a href="#">Продукти</a>
      <a href="#">За нас</a>
      <a href="#">Количка (0)</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Нова колекция 2026</h1>
    <p>Открийте най-добрите оферти за сезона</p>
  </section>

  <main class="container">
    <h2 class="section-title">Популярни продукти</h2>
    
    <div class="product-grid">
      
      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Продукт" class="product-image">
        <div class="product-info">
          <h3 class="product-title">Продукт 1</h3>
          <div class="product-price">49.99 лв.</div>
          <button class="btn-add-cart">Купи</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Продукт" class="product-image">
        <div class="product-info">
          <h3 class="product-title">Продукт 2</h3>
          <div class="product-price">89.00 лв.</div>
          <button class="btn-add-cart">Купи</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Продукт" class="product-image">
        <div class="product-info">
          <h3 class="product-title">Продукт 3</h3>
          <div class="product-price">25.50 лв.</div>
          <button class="btn-add-cart">Купи</button>
        </div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Продукт" class="product-image">
        <div class="product-info">
          <h3 class="product-title">Продукт 4</h3>
          <div class="product-price">110.00 лв.</div>
          <button class="btn-add-cart">Купи</button>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 StoreLogo. Всички права са запазени.</p>
  </footer>

</body>
</html>

/* CORE LUXURY DESIGN */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --gold: #c8a97e;
  --gold-dim: #7a6344;
  --bg: #000000;
  --bg-card: #0a0a0a;
  --border: #161616;
  --text-muted: #666666;
}

body {
  background: var(--bg);
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* PREMIUM FIXED NAVIGATION */
nav {
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 40px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  backdrop-filter: blur(10px);
  z-index: 100;
  border-bottom: 1px solid rgba(22, 22, 22, 0.5);
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 4px;
  color: #ffffff;
}

.logo em {
  color: var(--gold);
  font-style: normal;
}

.nav-links {
  display: flex;
  gap: 30px;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: color 0.3s;
}

.nav-links a:hover, .nav-links a.active {
  color: var(--gold);
}

/* HERO SECTION */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 120px 20px 60px;
  position: relative;
}

/* Subtle gold ambient glow in background */
.hero::before {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  background: var(--gold);
  opacity: 0.03;
  filter: blur(120px);
  top: 35%;
  pointer-events: none;
}

.hero-eyebrow {
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 16px;
}

.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 90px;
  letter-spacing: 8px;
  line-height: 0.95;
  text-transform: uppercase;
  margin-bottom: 24px;
}

@media(max-width: 768px) {
  .hero-title { font-size: 60px; }
  nav { padding: 20px; }
  .nav-links { display: none; } /* Clean layout for mobile testing */
}

.hero-subtitle {
  font-size: 16px;
  font-weight: 300;
  color: #888;
  max-width: 500px;
  line-height: 1.6;
  margin-bottom: 40px;
}

/* INTERACTIVE CTA BUTTON */
.cta-btn {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 18px 44px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
}

.cta-btn:hover {
  background: var(--gold);
  color: #000000;
  box-shadow: 0 0 30px rgba(200, 169, 126, 0.2);
}
